<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Metric/Imperial Unit Conversion</title>
    <link rel = "stylesheet" href = "index.css">
</head>
<body>
  <div class="converter">
    <div class="header">Metric/Imperial Unit Conversion</div>
    <div class="input-section">
      <input type="number" value="20">
      <br>
      <button>Convert</button>
    </div>
    <div class="results">
      <div class="category">
        <h3>Length (Meter/Feet)</h3>
        <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
      </div>
      <div class="category">
        <h3>Volume (Liters/Gallons)</h3>
        <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
      </div>
      <div class="category">
        <h3>Mass (Kilograms/Pounds)</h3>
        <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
